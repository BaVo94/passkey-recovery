<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="reminder" th:if="${passkeyCount == 1}" class="reminder">
    <p>
        Sie haben nur einen Passkey registriert. Geht das Gerät verloren, ist Ihr Konto
        nur noch über die Kontowiederherstellung erreichbar.
        <a th:href="@{/passkeylist}">Jetzt einen zweiten Passkey einrichten</a>
    </p>
</div>
</body>
</html>
