spring.application.name=passkey-recovery
spring.datasource.url=jdbc:postgresql://localhost:5432/passkey_recovery
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
app.webauthn.rp-id=localhost
app.webauthn.rp-name=Passkey Recovery Prototype
app.webauthn.origin=http://localhost:8080
app.recovery.code-validity=7d